<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Sweet Signal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="sweet.css">
</head>
<body>
  <div class="screen">
    <img src="sweet-bg.jpg" alt="" class="bg-image">

    <button id="signalButton" class="signal-btn" aria-label="Получить сигнал по Sweet Bonanza">
      <img src="sweet-btn.png" alt="Signal" class="signal-img">
    </button>

    <div id="loaderBox" class="loader-box hidden">
      <div class="loader-inner">
        <div class="loader-spinner"></div>
        <div class="loader-text">Analyzing...</div>
      </div>
    </div>

    <div id="resultBox" class="result-box hidden">
      <div class="result-inner">
        <div class="result-title">Sweet Signal</div>
        <div class="result-spins">
          До бонуски осталось
          <span id="spinsValue">—</span>
          вращений
        </div>
        <button id="closeResult" class="close-btn">OK</button>
      </div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">← Slots</button>
  </div>

  <script src="sweet.js"></script>
</body>
</html>
